name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-build:
    name: nix build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      # Fails fast if the pnpmDeps hash in flake.nix is stale relative to
      # pnpm-lock.yaml (fixed-output hash mismatch).
      - name: Build package
        run: nix build .#pox5-cli --print-build-logs

      - name: Smoke test
        run: nix run . -- --help
